

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pranav Reflex Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f8f1;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #2f5d34;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        #target, #counter {
            font-size: 24px;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h1>Pranav reflexes</h1>

    <div id="target">Your time</div>
    <div id="counter">Count</div>

    <button id="go" type="button">Go</button>
    <button id="halt" type="button">Halt</button>

    <script>
        // Part 5: Record Halt time

        let haltTime = undefined;
        let countdownRunning = false;
        let countdownTimers = [];

        function recordTime() {

            if (!countdownRunning ||
                haltTime !== undefined) {
                return;
            }

            haltTime = Date.now();

            console.log("Halt time:", haltTime);
        }

        // Connect Halt button
        document.getElementById("halt").onclick =
            recordTime;


        // Part 6: Countdown timer
        // Bonus: Random countdown from 2 to 10

        function beginTime() {

            // Clear previous timers
            countdownTimers.forEach(clearTimeout);
            countdownTimers = [];

            haltTime = undefined;
            countdownRunning = true;

            // Generate random starting number
            const startCount =
                Math.floor(Math.random() * 9) + 2;

            document.getElementById("target").innerHTML =
                "Press Halt just before zero!";

            document.getElementById("counter").innerHTML =
                "Count: " + startCount;

            // Countdown from random number to 0
            for (let i = 0; i <= startCount; i++) {

                const timer = setTimeout(function () {

                    document.getElementById("counter")
                        .innerHTML = "Count: " + i;

                }, (startCount - i) * 1000);

                countdownTimers.push(timer);
            }

            // Check result when countdown finishes
            const finalTimer = setTimeout(function () {

                countdownRunning = false;

                if (haltTime === undefined) {

                    document.getElementById("target")
                        .innerHTML = "Not soon enough";

                } else {

                    const targetTime = Date.now();

                    const elapsedTime =
                        targetTime - haltTime;

                    document.getElementById("target")
                        .innerHTML =
                        "Time was " + elapsedTime +
                        " milliseconds";
                }

            }, startCount * 1000);

            countdownTimers.push(finalTimer);
        }

        // Connect Go button
        document.getElementById("go").onclick =
            beginTime;

    </script>

</body>
</html>
