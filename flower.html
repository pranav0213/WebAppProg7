<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avian Flower Finder Game</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f8f1; margin: 0; padding: 16px; }
    h1 { text-align: center; color: #2f5d34; }

    .row { display: flex; gap: 4px; }
    .cell { width: 80px; height: 80px; }
    .cell img { width: 100%; height: 100%; display: block; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Pranav finds avians</h1>
  <div id="info">
    <div>Click on the locations to find the flowers, watch out for the poison ivy</div>

    <div id="score">Score is zero.</div>
    <div id="helpbtn">Click for help.</div>

  </div>
  <div id="field">
    <div class="row">
      <div class="cell"><img src="images/bush.png" alt="bush"></div>
      <div class="cell"><img src="images/bush.png" alt="bush"></div>

    <div class="row">

      <div class="cell"><img src="images/bush.png" alt="bush"></div>
      <div class="cell"><img src="images/bush.png" alt="bush"></div>
    </div>
    <div class="row">
      <div class="cell"><img src="images/bush.png" alt="bush"></div>
      <div class="cell"><img src="images/bush.png" alt="bush"></div>
      <div class="cell"><img src="images/bush.png" alt="bush"></div>
      <div class="cell"><img src="images/bush.png" alt="bush"></div>
      <div class="cell"><img src="images/bush.png" alt="bush"></div>
      <div class="cell"><img src="images/bush.png" alt="bush"></div>
    </div>
    <div class="row">
      <div class="cell"><img src="images/bush.png" alt="bush"></div>

      <div class="cell"><img src="images/bush.png" alt="bush"></div>

      <div class="cell"><img src="images/bush.png" alt="bush"></div>
    </div>
  </div>
  
<script>
  // Part 4: Flower Game

  const ids = Array.from({ length: 36 }, (_, i) => "img" + i);

  let score = 0;
  let locationsVisited = 0;
  let lastLocation = 0;

  let poisonLocation = 19;
  let roseLocation = 14;
  let lilyLocations = [3, 25];
  let daisyLocations = [2, 5, 11, 20, 21];

  let gameOver = false;
  const scoredLocations = new Set();

  // Give all 36 images unique IDs and click handlers
  const images = document.querySelectorAll("#field img");

  images.forEach((image, index) => {
    image.id = ids[index];
    image.onclick = function () {
      check(index);
    };
  });

  // Check the clicked position
  function check(position) {
    if (gameOver) return;

    const imageId = ids[position];
    const image = document.getElementById(imageId);

    if (!image) return;

    if (position === poisonLocation) {
      image.src = "images/ivy.png";
      score -= 4;
      gameOver = true;
      image.onclick = null;

    } else if (position === roseLocation) {
      image.src = "images/rose.png";

      if (!scoredLocations.has(position)) {
        score += 4;
        scoredLocations.add(position);
      }

    } else if (lilyLocations.includes(position)) {
      image.src = "images/lily.png";

      if (!scoredLocations.has(position)) {
        score += 2;
        scoredLocations.add(position);
      }

    } else if (daisyLocations.includes(position)) {
      image.src = "images/daisy.png";

      if (!scoredLocations.has(position)) {
        score += 1;
        scoredLocations.add(position);
      }
    }

    locationsVisited++;

    document.getElementById("locations").innerHTML =
      "Number of locations checked is " + locationsVisited;

    document.getElementById("score").innerHTML =
      "Score is " + score;

    lastLocation = position;
  }

  // Help function
  function help() {
    const row = Math.floor(lastLocation / 6);
    const col = lastLocation % 6;

    const neighbors = [
      ((row + 5) % 6) * 6 + col,
      ((row + 1) % 6) * 6 + col,
      row * 6 + ((col + 5) % 6),
      row * 6 + ((col + 1) % 6)
    ];

    let result = "warm";

    if (neighbors.some(n => daisyLocations.includes(n))) {
      result = "cold";
    } else {
      const nearby = [];

      for (let r = Math.max(0, row - 1);
           r <= Math.min(5, row + 1); r++) {
        for (let c = Math.max(0, col - 1);
             c <= Math.min(5, col + 1); c++) {
          nearby.push(r * 6 + c);
        }
      }

      if (nearby.includes(roseLocation)) {
        result = "hot";
      } else if (nearby.includes(poisonLocation)) {
        result = "watch out";
      }
    }

    document.getElementById("help").innerHTML = result;
    return result;
  }

  // Handle help click
  document.getElementById("helpbtn").onclick = help;
</script>

</body>
</html>
